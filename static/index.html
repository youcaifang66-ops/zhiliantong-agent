<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智扫通智能客服</title>
    <style>
        /* ==================== 全局样式 ==================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ==================== 主容器 ==================== */
        .container {
            width: 800px;
            height: 90vh;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ==================== 顶部标题栏 ==================== */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px 30px;
            text-align: center;
        }
        .header h1 { font-size: 22px; font-weight: 600; }
        .header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }

        /* ==================== 消息列表（滚动区域） ==================== */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 30px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ==================== 单条消息 ==================== */
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;      /* 保留换行和空格 */
            word-break: break-word;
        }
        .message.user {
            background: #667eea;
            color: #fff;
            align-self: flex-end;       /* 用户消息靠右 */
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            background: #f0f2f5;
            color: #333;
            align-self: flex-start;     /* 助手消息靠左 */
            border-bottom-left-radius: 4px;
        }

        /* ==================== 输入区域 ==================== */
        .input-area {
            padding: 16px 24px;
            border-top: 1px solid #e8e8e8;
            display: flex;
            gap: 12px;
            background: #fff;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-area input:focus {
            border-color: #667eea;
        }
        .input-area button {
            padding: 12px 28px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
            white-space: nowrap;
        }
        .input-area button:hover { background: #5a6fd6; }
        .input-area button:disabled {
            background: #b0b8e0;
            cursor: not-allowed;
        }

        /* ==================== 加载动画 ==================== */
        .loading {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 16px;
            background: #f0f2f5;
            border-radius: 12px;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .loading .dot {
            width: 8px; height: 8px;
            background: #999;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .loading .dot:nth-child(1) { animation-delay: -0.32s; }
        .loading .dot:nth-child(2) { animation-delay: -0.16s; }
        .loading .dot:nth-child(3) { animation-delay: 0s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* ==================== 快捷问题 ==================== */
        .suggestions {
            display: flex;
            gap: 8px;
            padding: 0 30px 16px;
            flex-wrap: wrap;
        }
        .suggestions button {
            padding: 6px 14px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background: #fff;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }
        .suggestions button:hover {
            border-color: #667eea;
            color: #667eea;
            background: #f5f6ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部标题 -->
        <div class="header">
            <h1>智扫通智能客服</h1>
            <p>基于 LLM + RAG + Agent 的扫地机器人智能问答系统</p>
        </div>

        <!-- 消息列表 -->
        <div class="messages" id="messages"></div>

        <!-- 快捷问题 -->
        <div class="suggestions" id="suggestions">
            <button onclick="sendMessage('小户型适合哪些扫地机器人？')">🏠 小户型选购</button>
            <button onclick="sendMessage('机器人无法连接WiFi怎么办？')">📡 WiFi连接故障</button>
            <button onclick="sendMessage('扫地机器人的维护保养方法有哪些？')">🔧 维护保养</button>
            <button onclick="sendMessage('拖地时水箱漏水怎么处理？')">💧 水箱漏水</button>
        </div>

        <!-- 输入区域 -->
        <div class="input-area">
            <input type="text" id="input" placeholder="请输入您的问题..." onkeydown="if(event.key==='Enter') send()">
            <button id="sendBtn" onclick="send()">发送</button>
        </div>
    </div>

    <script>
        /*
         * 前端 JS 逻辑
         * 核心功能：调用后端 FastAPI 接口，展示流式响应
         * 【技术要点】使用 fetch + ReadableStream 处理 SSE 流式数据
         */

        // ========== DOM 元素引用 ==========
        const messagesDiv = document.getElementById('messages');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');

        // ========== 工具函数：在消息列表中添加一条消息 ==========
        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = content;
            messagesDiv.appendChild(div);
            // 自动滚动到底部
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return div;  // 返回元素，方便后续追加内容（流式更新用）
        }

        // ========== 工具函数：显示/隐藏"正在输入"动画 ==========
        let loadingEl = null;
        function showLoading() {
            loadingEl = document.createElement('div');
            loadingEl.className = 'loading';
            loadingEl.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
            messagesDiv.appendChild(loadingEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        function hideLoading() {
            if (loadingEl) { loadingEl.remove(); loadingEl = null; }
        }

        // ========== 核心函数：发送消息（流式） ==========
        /*
         * 【与前端的交互流程】
         * 1. 用户点击发送 → 2. 显示用户消息 → 3. 调用 POST /chat 接口
         * 4. 后端一段一段返回文字（SSE格式） → 5. 前端逐段追加显示
         */
        async function sendMessage(text) {
            // 如果传入文本，直接使用
            if (text) input.value = text;
            const query = text || input.value.trim();
            if (!query) return;

            // 清空输入框
            input.value = '';
            // 禁用按钮，防止重复发送
            sendBtn.disabled = true;

            // 显示用户消息
            addMessage('user', query);
            // 显示加载动画
            showLoading();

            try {
                /*
                 * 【Fetch API 流式请求】
                 * fetch 默认会等全部响应才返回，但这里我们设置不缓存 body
                 * 通过 response.body.getReader() 逐块读取流数据
                 *
                 * 后端返回格式（SSE）：
                 * data: {"content": "你好"}\n\n
                 * data: {"content": "我是"}\n\n
                 * data: {"content": "客服"}\n\n
                 */
                const response = await fetch(`${window.location.origin}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query }),
                });

                // 隐藏加载动画，创建助手消息容器
                hideLoading();
                const assistantDiv = addMessage('assistant', '');

                /*
                 * 【关键】读取流式响应
                 * getReader() 逐块读取，每次读到一部分就更新界面
                 */
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';          // 缓冲区：处理跨块的 SSE 数据

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    // 将二进制数据解码为字符串
                    buffer += decoder.decode(value, { stream: true });

                    // SSE 数据以 \n\n 分隔，按此分割处理
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop() || '';  // 最后一段可能不完整，留在缓冲区

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                // 解析 JSON：去掉 "data: " 前缀
                                const data = JSON.parse(line.slice(6));
                                if (data.content) {
                                    // 追加内容到助手消息
                                    assistantDiv.textContent += data.content;
                                    // 自动滚动到底部
                                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                                }
                                if (data.error) {
                                    assistantDiv.textContent = '【错误】' + data.error;
                                }
                            } catch (e) {
                                // JSON 解析失败，忽略
                            }
                        }
                    }
                }
            } catch (e) {
                hideLoading();
                addMessage('assistant', '❌ 连接失败，请确保后端服务已启动');
            } finally {
                // 恢复按钮
                sendBtn.disabled = false;
                input.focus();
            }
        }

        // ========== 发送函数（从输入框取内容） ==========
        function send() {
            if (input.value.trim()) {
                sendMessage(input.value.trim());
            }
        }
    </script>
</body>
</html>
