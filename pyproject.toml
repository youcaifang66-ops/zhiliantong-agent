[project]
name = "zhiliantong-agent"
version = "1.0.0"
description = "Reliable fitness planning and training record agent"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "jieba>=0.42.1",
  "langchain>=1.2,<2",
  "langchain-chroma>=1.1,<2",
  "langchain-community>=0.4,<1",
  "langgraph>=1.0,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "rank-bm25>=0.2.2,<1",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
